<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Photo to Anime Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f111a; color: #fff; padding: 16px; }
    h1 { text-align: center; font-size: 20px; margin-bottom: 20px; color: #a29bfe; }
    
    /* Upload Box */
    .upload-card {
      border: 2px dashed #4b4b68;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      background: #181926;
      margin-bottom: 20px;
    }
    .upload-card input { display: none; }
    .upload-card label { cursor: pointer; color: #8c7ae6; font-weight: bold; }
    #preview-img { max-width: 120px; border-radius: 8px; margin-top: 10px; display: none; margin-left: auto; margin-right: auto; }

    /* Style Selector Grid */
    .section-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #dcdde1; }
    .style-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .style-card {
      background: #1e1f2e;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
    }
    .style-card.active {
      border-color: #9b59b6;
      background: #2d2442;
    }
    .style-card img {
      width: 100%;
      height: 75px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .style-card span { font-size: 12px; font-weight: 600; }

    /* Generate Button */
    .btn-generate {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8e44ad, #9b59b6);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    
    /* Result Area */
    #result-box { margin-top: 24px; text-align: center; display: none; }
    #result-img { width: 100%; max-width: 320px; border-radius: 12px; border: 2px solid #8e44ad; }
  </style>
</head>
<body>

  <h1>✨ AI Anime Transformer</h1>

  <!-- Upload Section -->
  <div class="upload-card">
    <label for="imageUpload">📁 Tap here to upload photo</label>
    <input type="file" id="imageUpload" accept="image/*" onchange="showPreview(event)" />
    <img id="preview-img" alt="Upload Preview" />
  </div>

  <div class="section-title">Select Anime Style / LoRA</div>

  <!-- Style Cards Grid -->
  <div class="style-grid">
    <div class="style-card active" onclick="selectStyle(this, 'anime')">
      <img src="https://picsum.photos/seed/anime/150/150" />
      <span>Anime</span>
    </div>
    <div class="style-card" onclick="selectStyle(this, 'kawaii')">
      <img src="https://picsum.photos/seed/kawaii/150/150" />
      <span>Kawaii</span>
    </div>
    <div class="style-card" onclick="selectStyle(this, 'manga')">
      <img src="https://picsum.photos/seed/manga/150/150" />
      <span>Manga</span>
    </div>
    <div class="style-card" onclick="selectStyle(this, 'ghibli')">
      <img src="https://picsum.photos/seed/ghibli/150/150" />
      <span>Ghibli</span>
    </div>
    <div class="style-card" onclick="selectStyle(this, 'webtoon')">
      <img src="https://picsum.photos/seed/webtoon/150/150" />
      <span>Webtoon</span>
    </div>
    <div class="style-card" onclick="selectStyle(this, 'chibi')">
      <img src="https://picsum.photos/seed/chibi/150/150" />
      <span>Chibi</span>
    </div>
  </div>

  <button class="btn-generate" onclick="generateAnime()">🚀 Generate</button>

  <div id="result-box">
    <div class="section-title">Result Image:</div>
    <img id="result-img" />
  </div>

  <script>
    // Colab का नया Gradio URL यहाँ डालें
    const BACKEND_URL = "https://eb15bbcee645d8f05b.gradio.live/";
    let selectedStyleName = "anime";

    function selectStyle(element, styleName) {
      document.querySelectorAll('.style-card').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      selectedStyleName = styleName;
    }

    function showPreview(event) {
      const file = event.target.files[0];
      if (file) {
        const preview = document.getElementById('preview-img');
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      }
    }

    async function generateAnime() {
      const fileInput = document.getElementById('imageUpload');
      if (!fileInput.files[0]) {
        return alert('कृपया पहले कोई फ़ोटो अपलोड करें!');
      }

      alert('Processing... AI मॉडल आपकी इमेज बना रहा है (10-25 सेकंड)');

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('style', selectedStyleName);

      try {
        const response = await fetch(`${BACKEND_URL}/style-transfer`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        if (data.image_base64) {
          const resBox = document.getElementById('result-box');
          const resImg = document.getElementById('result-img');
          resImg.src = data.image_base64;
          resBox.style.display = 'block';
          resBox.scrollIntoView({ behavior: 'smooth' });
        } else {
          alert('इमेज रेंडरिंग में एरर आया। कृपया दोबारा कोशिश करें।');
        }
      } catch (err) {
        alert('सर्वर कनेक्ट नहीं हुआ। सुनिश्चित करें Colab चल रहा है।');
      }
    }
  </script>
</body>
</html>
